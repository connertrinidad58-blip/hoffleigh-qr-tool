<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
header { width: 100%; background: #E8192C; text-align: center; padding: 20px 20px 18px; }
header img { height: 70px; display: block; margin: 0 auto; }
.card { background: white; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,.10); padding: 28px 24px; margin: 28px 16px; width: 100%; max-width: 420px; text-align: center; }
.address { font-size: 1.25rem; font-weight: bold; color: #1a1a1a; margin-bottom: 6px; }
.broker-name { font-size: 1.05rem; color: #E8192C; font-weight: bold; margin-bottom: 2px; }
.broker-title { font-size: .9rem; color: #888; margin-bottom: 24px; }
hr { border: none; border-top: 1px solid #eee; margin: 20px 0; }
.btn { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 16px; border-radius: 10px; font-size: 1.05rem; font-weight: bold; text-decoration: none; margin-bottom: 12px; transition: opacity .15s; }
.btn:hover { opacity: .88; }
.btn-call    { background: #E8192C; color: white; }
.btn-text    { background: #1a1a1a; color: white; }
.btn-email   { background: #f0f0f0; color: #1a1a1a; border: 1.5px solid #ddd; }
.btn-listing { background: white; color: #E8192C; border: 2px solid #E8192C; }
.btn svg { width: 22px; height: 22px; flex-shrink: 0; }
.hidden { display: none !important; }
footer { margin-top: auto; padding: 20px; text-align: center; color: #bbb; font-size: .8rem; }
</style>

<footer>Hoff &amp; Leigh Commercial Real Estate &bull; Colorado Springs, CO</footer>

<script>
var p = new URLSearchParams(window.location.search);
var address = p.get('address') || 'Property';
var broker  = p.get('broker')  || '';
var title   = p.get('title')   || 'Broker';
var phone   = p.get('phone')   || '';
var email   = p.get('email')   || '';
var listing = p.get('listing') || '';

document.getElementById('address').textContent      = address;
document.getElementById('broker-name').textContent  = broker;
document.getElementById('broker-title').textContent = title;
document.title = address + ' — Hoff & Leigh';

var callBtn    = document.getElementById('btn-call');
var textBtn    = document.getElementById('btn-text');
var emailBtn   = document.getElementById('btn-email');
var listingBtn = document.getElementById('btn-listing');

if (phone) {
  var clean = phone.replace(/\D/g, '');
  callBtn.href = 'tel:+1' + clean;
  textBtn.href = 'sms:+1' + clean;
} else {
  callBtn.classList.add('hidden');
  textBtn.classList.add('hidden');
}
if (email) {
  emailBtn.href = 'mailto:' + email + '?subject=Inquiry about ' + encodeURIComponent(address);
} else {
  emailBtn.classList.add('hidden');
}
if (listing) {
  listingBtn.href = listing;
} else {
  listingBtn.classList.add('hidden');
}
</script>
