<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoff &amp; Leigh — Property Contact</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

header {
  width: 100%;
  background: #E8192C;
  color: white;
  text-align: center;
  padding: 28px 20px 24px;
}
header h1 { font-size: 1.9rem; font-weight: bold; }
header p  { font-size: 0.95rem; opacity: 0.85; margin-top: 4px; }

.card {
  background: white;
  border-radius: 14px;
  box-shadow: 0 4px 20px rgba(0,0,0,.10);
  padding: 28px 24px;
  margin: 28px 16px;
  width: 100%;
  max-width: 420px;
  text-align: center;
}

.address {
  font-size: 1.25rem;
  font-weight: bold;
  color: #1a1a1a;
  margin-bottom: 6px;
}
.broker-name {
  font-size: 1.05rem;
  color: #E8192C;
  font-weight: bold;
  margin-bottom: 2px;
}
.broker-title {
  font-size: 0.9rem;
  color: #888;
  margin-bottom: 24px;
}

.divider {
  border: none;
  border-top: 1px solid #eee;
  margin: 20px 0;
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  padding: 16px;
  border-radius: 10px;
  font-size: 1.05rem;
  font-weight: bold;
  text-decoration: none;
  margin-bottom: 12px;
  transition: opacity 0.15s;
}
.btn:hover { opacity: 0.88; }
.btn:active { opacity: 0.7; }

.btn-call  { background: #E8192C; color: white; }
.btn-text  { background: #1a1a1a; color: white; }
.btn-email { background: #f0f0f0; color: #1a1a1a; border: 1.5px solid #ddd; }
.btn-listing { background: white; color: #E8192C; border: 2px solid #E8192C; }

.btn svg { width: 22px; height: 22px; flex-shrink: 0; }

.hidden { display: none !important; }

footer {
  margin-top: auto;
  padding: 20px;
  text-align: center;
  color: #bbb;
  font-size: 0.8rem;
}
</style>
</head>
<body>

<header>
  <h1>Hoff &amp; Leigh</h1>
  <p>Commercial Real Estate</p>
</header>

<div class="card">
  <div class="address" id="address">Loading...</div>
  <div class="broker-name" id="broker-name"></div>
  <div class="broker-title" id="broker-title"></div>

  <hr class="divider">

  <a id="btn-call" class="btn btn-call" href="#">
    <svg viewBox="0 0 24 24" fill="white"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg>
    Call Broker
  </a>

  <a id="btn-text" class="btn btn-text" href="#">
    <svg viewBox="0 0 24 24" fill="white"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.2L4 17.2V4h16v12z"/></svg>
    Text Broker
  </a>

  <a id="btn-email" class="btn btn-email" href="#">
    <svg viewBox="0 0 24 24" fill="#1a1a1a"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
    Email Broker
  </a>

  <hr class="divider">

  <a id="btn-listing" class="btn btn-listing" href="#">
    <svg viewBox="0 0 24 24" fill="#E8192C"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    View Property Listing
  </a>
</div>

<footer>Hoff &amp; Leigh Commercial Real Estate &bull; Colorado Springs, CO</footer>

<script>
// Read params from URL
var params = new URLSearchParams(window.location.search);
var address = params.get('address') || 'Property';
var broker  = params.get('broker')  || '';
var title   = params.get('title')   || 'Broker';
var phone   = params.get('phone')   || '';
var email   = params.get('email')   || '';
var listing = params.get('listing') || '';

// Fill in text
document.getElementById('address').textContent     = address;
document.getElementById('broker-name').textContent = broker;
document.getElementById('broker-title').textContent = title;
document.title = address + ' — Hoff & Leigh';

// Wire up buttons
var callBtn    = document.getElementById('btn-call');
var textBtn    = document.getElementById('btn-text');
var emailBtn   = document.getElementById('btn-email');
var listingBtn = document.getElementById('btn-listing');

if (phone) {
  var clean = phone.replace(/\D/g, '');
  callBtn.href = 'tel:+1' + clean;
  textBtn.href = 'sms:+1' + clean;
} else {
  callBtn.classList.add('hidden');
  textBtn.classList.add('hidden');
}

if (email) {
  emailBtn.href = 'mailto:' + email + '?subject=Inquiry about ' + encodeURIComponent(address);
} else {
  emailBtn.classList.add('hidden');
}

if (listing) {
  listingBtn.href = listing;
} else {
  listingBtn.classList.add('hidden');
}
</script>
</body>
</html>
