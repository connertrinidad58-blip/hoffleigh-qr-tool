<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoff & Leigh — QR Code Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f5f5f5; min-height: 100vh; }

  header {
    background: #E8192C; color: white;
    text-align: center; padding: 28px 20px 22px;
  }
  header h1 { font-size: 2rem; font-weight: bold; }
  header p  { font-size: 1rem; opacity: 0.9; margin-top: 6px; }

  .container {
    max-width: 860px; margin: 36px auto; padding: 0 16px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 28px;
  }
  @media(max-width:640px){ .container{ grid-template-columns:1fr; } }

  .card {
    background: white; border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,.08); padding: 28px;
  }
  .card h2 {
    font-size: 1.1rem; color: #E8192C; margin-bottom: 20px;
    padding-bottom: 10px; border-bottom: 2px solid #E8192C;
  }

  label { display: block; font-size: .85rem; font-weight: bold; color: #444; margin-bottom: 4px; }
  input {
    width: 100%; padding: 10px 12px; border: 1.5px solid #ddd;
    border-radius: 6px; font-size: .95rem; margin-bottom: 14px;
  }
  input:focus { outline: none; border-color: #E8192C; }

  #gen-btn {
    width: 100%; padding: 13px; background: #E8192C; color: white;
    border: none; border-radius: 8px; font-size: 1rem; font-weight: bold;
    cursor: pointer; margin-top: 4px;
  }
  #gen-btn:hover { background: #c0121f; }

  #preview-panel { display: flex; flex-direction: column; align-items: center; }
  #preview-panel h2 { width: 100%; }

  #canvas-wrap { width:100%; display:flex; flex-direction:column; align-items:center; gap:16px; margin-top:12px; }

  canvas { border-radius:8px; box-shadow:0 2px 12px rgba(0,0,0,.15); max-width:100%; }

  #download-btn {
    display: none; padding: 11px 32px; background: #222; color: white;
    border: none; border-radius: 8px; font-size: .95rem; font-weight: bold;
    cursor: pointer; text-decoration: none;
  }
  #download-btn:hover { background: #444; }

  #placeholder {
    width:100%; padding:60px 20px; border:2px dashed #ddd;
    border-radius:10px; text-align:center; color:#aaa; font-size:.95rem; margin-top:12px;
  }
  #placeholder span { font-size:2.5rem; display:block; margin-bottom:8px; }
  #qr-tmp { position:absolute; left:-9999px; top:-9999px; }
  .req { color:#E8192C; }
</style>
</head>
<body>

<header>
  <h1>Hoff &amp; Leigh</h1>
  <p>QR Code Generator — create a branded QR code for any property listing</p>
</header>

<div class="container">

  <div class="card">
    <h2>Property Details</h2>
    <label>Listing URL <span class="req">*</span></label>
    <input id="url" type="url" placeholder="https://www.hoffleigh.com/listing/..." />

    <label>Property Address <span class="req">*</span></label>
    <input id="address" placeholder="1234 Main St, Suite 100" />

    <label>Broker Full Name <span class="req">*</span></label>
    <input id="broker" placeholder="Jane Smith" />

    <label>Broker Title</label>
    <input id="title" placeholder="Broker" value="Broker" />

    <label>Phone Number</label>
    <input id="phone" placeholder="(719) 555-1234" />

    <label>Email Address</label>
    <input id="email" placeholder="name@hoffleigh.com" />

    <button id="gen-btn" onclick="generate()">&#9654; Generate QR Code</button>
  </div>

  <div class="card" id="preview-panel">
    <h2>Preview &amp; Download</h2>
    <div id="canvas-wrap">
      <div id="placeholder">
        <span>🏢</span>
        Fill in the details and click<br><strong>Generate QR Code</strong>
      </div>
      <canvas id="qr-canvas" width="500" height="680" style="display:none"></canvas>
      <a id="download-btn">&#11015; Download PNG</a>
    </div>
  </div>

</div>

<!-- Hidden div for QRCode library to render into -->
<div id="qr-tmp"></div>

<script>
function trunc(ctx, text, maxW) {
  while (ctx.measureText(text).width > maxW && text.length > 4)
    text = text.slice(0, -2) + '…';
  return text;
}
function center(ctx, text, y, font, color, maxW) {
  ctx.font = font;
  ctx.fillStyle = color;
  text = trunc(ctx, text, maxW);
  ctx.fillText(text, (500 - ctx.measureText(text).width) / 2, y);
}

function generate() {
  var url     = document.getElementById('url').value.trim();
  var address = document.getElementById('address').value.trim();
  var broker  = document.getElementById('broker').value.trim();
  var title   = document.getElementById('title').value.trim() || 'Broker';
  var phone   = document.getElementById('phone').value.trim();
  var email   = document.getElementById('email').value.trim();

  if (!url)     { alert('Please enter the listing URL.'); return; }
  if (!address) { alert('Please enter the property address.'); return; }
  if (!broker)  { alert('Please enter the broker name.'); return; }
  if (!url.startsWith('http')) url = 'https://' + url;

  // Clear old QR and generate new one
  var tmp = document.getElementById('qr-tmp');
  tmp.innerHTML = '';

  new QRCode(tmp, {
    text: url,
    width: 460, height: 460,
    colorDark: '#E8192C',
    colorLight: '#FFFFFF',
    correctLevel: QRCode.CorrectLevel.H
  });

  // Wait a tick for QRCode to finish rendering
  setTimeout(function() {
    var qrImg = tmp.querySelector('img') || tmp.querySelector('canvas');
    if (!qrImg) { alert('QR generation failed. Please try again.'); return; }

    var canvas = document.getElementById('qr-canvas');
    var ctx    = canvas.getContext('2d');
    var W=500, H=680, HH=90, FH=95, QH=H-HH-FH;

    // White background
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, W, H);

    // Red header
    ctx.fillStyle = '#E8192C';
    ctx.fillRect(0, 0, W, HH);

    // Red footer
    ctx.fillStyle = '#E8192C';
    ctx.fillRect(0, H-FH, W, FH);

    // Header: "Hoff & Leigh"
    ctx.font = 'bold 34px Arial';
    ctx.fillStyle = '#FFFFFF';
    var lw = ctx.measureText('Hoff & Leigh').width;
    ctx.fillText('Hoff & Leigh', (W-lw)/2, 56);

    // Underline
    ctx.fillStyle = 'rgba(160,8,20,0.9)';
    ctx.fillRect(W/2-55, 66, 110, 5);

    // QR code image
    var qrX = (W-460)/2;
    var qrY = HH + (QH-460)/2;
    ctx.drawImage(qrImg, qrX, qrY, 460, 460);

    // Footer text
    var ft = H-FH+26;
    center(ctx, address, ft, 'bold 20px Arial', '#FFFFFF', 460);
    center(ctx, broker + (title ? '  |  '+title : ''), ft+30, '17px Arial', '#FFFFFF', 460);
    var contact = [phone, email].filter(Boolean).join('   |   ');
    if (contact) center(ctx, contact, ft+54, '14px Arial', '#FFFFFF', 460);

    // Show result
    document.getElementById('placeholder').style.display = 'none';
    canvas.style.display = 'block';

    // Download link
    var safe = address.replace(/[^a-zA-Z0-9]/g,'_').replace(/_+/g,'_').slice(0,60);
    var dl = document.getElementById('download-btn');
    dl.href     = canvas.toDataURL('image/png');
    dl.download = safe + '.png';
    dl.style.display = 'inline-block';

  }, 200);
}
</script>
</body>
</html>
